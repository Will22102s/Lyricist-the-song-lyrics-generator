name: Release

# Push a version tag (e.g. `git push origin v2.3.0`) to build the Windows and
# Linux apps and attach both archives to that GitHub Release.  Run the workflow
# manually to produce downloadable artifacts without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          LYRICIST_NO_UPDATE_CHECK: "1"
        run: pytest -q

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows-x64
            archive: zip
          - name: Linux
            os: ubuntu-latest
            platform: linux-x86_64
            archive: gztar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Read version from config.py
        id: version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path("local_sync_lyrics/config.py").read_text(encoding="utf-8")
          print("version=" + re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY

      - name: Build standalone app
        run: python build.py --clean

      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python - <<'PY'
          import os, shutil
          base = f"release/Lyricist-{os.environ['VERSION']}-{os.environ['PLATFORM']}"
          os.makedirs("release", exist_ok=True)
          shutil.make_archive(base, os.environ["ARCHIVE"], "dist", "Lyricist")
          print("packaged:", base)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List assets
        run: ls -lh release

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
